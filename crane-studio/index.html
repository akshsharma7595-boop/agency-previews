    // Web Audio Synthesizer for Mechanical Crane SFX
    let audioCtx = null;
    function playMechanicalSound(freq, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // ==========================================
    // THREE.JS SETUP & SCENE LIGHTING
    // ==========================================
    const canvas = document.getElementById('webglCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = null; // Transparent so background watermark shows cleanly

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 11.5);
    camera.lookAt(0, 0.1, 0);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.95);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xFFFFFF, 1.3);
    dirLight.position.set(8, 16, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x5A9FE2, 0.6);
    rimLight.position.set(-8, 6, -6);
    scene.add(rimLight);

    const interiorPointLight = new THREE.PointLight(0xFFFFFF, 0, 8);
    scene.add(interiorPointLight);

    // ==========================================
    // TEXTURE GENERATORS
    // ==========================================
    // 1. Corrugated Bump Texture
    function createCorrugatedBumpMap() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const ridges = 16;
      const w = 256 / ridges;
      for (let i = 0; i < ridges; i++) {
        const grad = ctx.createLinearGradient(i * w, 0, (i + 1) * w, 0);
        grad.addColorStop(0, '#222222');
        grad.addColorStop(0.3, '#ffffff');
        grad.addColorStop(0.7, '#ffffff');
        grad.addColorStop(1, '#222222');
        ctx.fillStyle = grad;
        ctx.fillRect(i * w + 1, 0, w - 2, 256);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 1);
      return tex;
    }
    const corrugatedBumpTex = createCorrugatedBumpMap();

    // 2. Door Decal Texture Generator
    function createDoorTextTexture(text, isLeft, baseColorHex, textHex) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      
      ctx.fillStyle = baseColorHex;
      ctx.fillRect(0, 0, 512, 512);

      // Subtle corrugated vertical lines
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      for (let x = 0; x < 512; x += 32) {
        ctx.fillRect(x, 0, 16, 512);
      }

      // Top Corner Stencil
      ctx.fillStyle = textHex === '#FFFFFF' ? 'rgba(255, 255, 255, 0.8)' : 'rgba(12, 27, 72, 0.7)';
      ctx.font = 'bold 22px "Space Grotesk", monospace';
      ctx.fillText(isLeft ? 'PORT-01 // FLAGSHIP' : 'LATCH // LOCK', 36, 64);

      // Main Stamped Bold Typography
      ctx.font = '900 86px "Syne", sans-serif';
      ctx.fillStyle = textHex;
      ctx.textAlign = isLeft ? 'left' : 'right';
      ctx.fillText(text, isLeft ? 40 : 472, 280);

      // Bottom Stencil Rules
      ctx.fillStyle = textHex === '#FFFFFF' ? 'rgba(255, 255, 255, 0.4)' : 'rgba(12, 27, 72, 0.3)';
      ctx.fillRect(36, 440, 440, 5);

      return new THREE.CanvasTexture(c);
    }

    // 3. Container Interior Display Texture
    function createInteriorScreenTexture(cfg) {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 640;
      const ctx = c.getContext('2d');

      // Crisp White Canvas Inside
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 1024, 640);

      // Header Tag
      ctx.fillStyle = '#0C1B48';
      ctx.font = 'bold 22px "JetBrains Mono", monospace';
      ctx.fillText(cfg.cat, 60, 80);

      // Title
      ctx.font = '900 58px "Syne", sans-serif';
      ctx.fillStyle = '#0C1B48';
      ctx.fillText(cfg.title, 60, 155);

      // Badge Pill
      ctx.fillStyle = cfg.accentHex;
      ctx.fillRect(60, 195, 300, 36);
      ctx.font = 'bold 16px "Space Grotesk", sans-serif';
      ctx.fillStyle = '#0C1B48';
      ctx.textAlign = 'center';
      ctx.fillText(cfg.badge, 210, 219);
      ctx.textAlign = 'left';

      // Description lines
      ctx.font = '500 24px "Space Grotesk", sans-serif';
      ctx.fillStyle = '#475569';
      
      const words = cfg.desc.split(' ');
      let line = '';
      let y = 290;
      const maxWidth = 900;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, 60, y);
          line = words[n] + ' ';
          y += 38;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, 60, y);

      // Button
      const btnY = 500;
      const btnW = 420;
      const btnH = 74;
      ctx.fillStyle = cfg.accentHex;
      ctx.fillRect(60, btnY, btnW, btnH);

      ctx.font = '900 22px "Archivo Black", sans-serif';
      ctx.fillStyle = '#0C1B48';
      ctx.textAlign = 'center';
      ctx.fillText(cfg.cta + '  →', 60 + btnW / 2, btnY + 46);

      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // ==========================================
    // 3D SCENE: DOCK & OVERHEAD CRANE
    // ==========================================
    // Dock Floor
    const groundGeo = new THREE.PlaneGeometry(60, 40);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x13357A, // Industrial Dock Deep Blue
      roughness: 0.65,
      metalness: 0.15
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2.6;
    ground.receiveShadow = true;
    scene.add(ground);

    // Dock Safety Line
    const dockLineGeo = new THREE.PlaneGeometry(40, 0.12);
    const dockLineMat = new THREE.MeshBasicMaterial({ color: 0xF2EA1E, transparent: true, opacity: 0.8 });
    const dockLine = new THREE.Mesh(dockLineGeo, dockLineMat);
    dockLine.rotation.x = -Math.PI / 2;
    dockLine.position.set(0, -2.58, 2.2);
    scene.add(dockLine);

    // Overhead Gantry Rail (High Enough to Prevent Top HUD Clipping!)
    const trackGroup = new THREE.Group();
    const beamGeo = new THREE.BoxGeometry(26, 0.35, 0.45);
    const beamMat = new THREE.MeshStandardMaterial({ color: 0xF1F5F9, roughness: 0.3, metalness: 0.5 });
    const beamMesh = new THREE.Mesh(beamGeo, beamMat);
    beamMesh.castShadow = true;
    trackGroup.add(beamMesh);

    trackGroup.position.set(0, 6.4, 0);
    scene.add(trackGroup);

    // Motorized Crane Carriage & Spreader Frame
    const craneTrolleyGroup = new THREE.Group();
    const trolleyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 0.8), new THREE.MeshStandardMaterial({ color: 0x0C1B48, roughness: 0.3 }));
    trolleyMesh.castShadow = true;
    craneTrolleyGroup.add(trolleyMesh);

    // Dual Hoist Drums
    const drumGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.5, 16);
    const drumMat = new THREE.MeshStandardMaterial({ color: 0xF2EA1E, roughness: 0.3 });
    const drumL = new THREE.Mesh(drumGeo, drumMat);
    drumL.rotation.z = Math.PI / 2;
    drumL.position.set(-0.55, -0.22, 0);
    craneTrolleyGroup.add(drumL);
    const drumR = drumL.clone();
    drumR.position.set(0.55, -0.22, 0);
    craneTrolleyGroup.add(drumR);

    // Spreader Group & Cables
    const spreaderGroup = new THREE.Group();
    const spreaderFrameGeo = new THREE.BoxGeometry(2.3, 0.18, 1.55);
    const spreaderFrameMat = new THREE.MeshStandardMaterial({ color: 0xF2EA1E, roughness: 0.3 });
    const spreaderMesh = new THREE.Mesh(spreaderFrameGeo, spreaderFrameMat);
    spreaderMesh.castShadow = true;
    spreaderGroup.add(spreaderMesh);

    // Corner Twistlock Claws
    const clawGeo = new THREE.BoxGeometry(0.18, 0.25, 0.18);
    const clawMat = new THREE.MeshStandardMaterial({ color: 0x0C1B48 });
    [
      [-1.1, -0.16, -0.75],
      [1.1, -0.16, -0.75],
      [-1.1, -0.16, 0.75],
      [1.1, -0.16, 0.75]
    ].forEach(([cx, cy, cz]) => {
      const claw = new THREE.Mesh(clawGeo, clawMat);
      claw.position.set(cx, cy, cz);
      spreaderGroup.add(claw);
    });

    craneTrolleyGroup.add(spreaderGroup);
    trackGroup.add(craneTrolleyGroup);

    // Cable Renders
    const cableMat = new THREE.LineBasicMaterial({ color: 0x0C1B48, linewidth: 2 });
    function createCable() {
      const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -1, 0)]);
      return new THREE.Line(geo, cableMat);
    }
    const cables = [createCable(), createCable(), createCable(), createCable()];
    cables.forEach(c => craneTrolleyGroup.add(c));

    function updateCables() {
      const sy = spreaderGroup.position.y;
      const anchors = [
        [-0.55, -0.22, -0.2, -1.0, sy, -0.65],
        [-0.55, -0.22, 0.2, -1.0, sy, 0.65],
        [0.55, -0.22, -0.2, 1.0, sy, -0.65],
        [0.55, -0.22, 0.2, 1.0, sy, 0.65]
      ];
      cables.forEach((c, idx) => {
        const [x1, y1, z1, x2, y2, z2] = anchors[idx];
        const pos = c.geometry.attributes.position;
        pos.setXYZ(0, x1, y1, z1);
        pos.setXYZ(1, x2, y2, z2);
        pos.needsUpdate = true;
      });
    }

    // ==========================================
    // 3D CONTAINERS BUILDER (GENEROUSLY SPACED, ZERO OVERLAP!)
    // ==========================================
    const DOCK_CONTAINERS = [];
    const containerWidth = 2.3;
    const containerHeight = 1.75;
    const containerDepth = 1.55;
    const wallThick = 0.05;

    // 4 Perfectly Spaced Coordinates (Center distance 3.0 vs Width 2.3 -> 0.7 units air gap!)
    const dockCoordinates = [
      { x: -4.5, y: -1.8, z: 0.0, rotY: -0.06 },
      { x: -1.5, y: -1.8, z: 0.0, rotY: 0.02 },
      { x: 1.5,  y: -1.8, z: 0.0, rotY: -0.02 },
      { x: 4.5,  y: -1.8, z: 0.0, rotY: 0.06 }
    ];

    function build3DContainer(cfg, idx) {
      const group = new THREE.Group();
      group.userData = { config: cfg, index: idx };

      const wallMat = new THREE.MeshStandardMaterial({
        color: cfg.color,
        roughness: 0.45,
        metalness: 0.2,
        bumpMap: corrugatedBumpTex,
        bumpScale: 0.04
      });

      // Shell Walls
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(containerWidth, containerHeight, wallThick), wallMat);
      backWall.position.set(0, 0, -containerDepth / 2 + wallThick / 2);
      backWall.castShadow = true;
      group.add(backWall);

      const topWall = new THREE.Mesh(new THREE.BoxGeometry(containerWidth, wallThick, containerDepth), wallMat);
      topWall.position.set(0, containerHeight / 2 - wallThick / 2, 0);
      topWall.castShadow = true;
      group.add(topWall);

      const botWall = new THREE.Mesh(new THREE.BoxGeometry(containerWidth, wallThick, containerDepth), wallMat);
      botWall.position.set(0, -containerHeight / 2 + wallThick / 2, 0);
      botWall.receiveShadow = true;
      group.add(botWall);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, containerHeight, containerDepth), wallMat);
      leftWall.position.set(-containerWidth / 2 + wallThick / 2, 0, 0);
      leftWall.castShadow = true;
      group.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, containerHeight, containerDepth), wallMat);
      rightWall.position.set(containerWidth / 2 - wallThick / 2, 0, 0);
      rightWall.castShadow = true;
      group.add(rightWall);

      // Corner Castings
      const cornerGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
      const cornerMat = new THREE.MeshStandardMaterial({ color: 0x0C1B48, roughness: 0.3 });
      [
        [-containerWidth / 2, containerHeight / 2, containerDepth / 2],
        [containerWidth / 2, containerHeight / 2, containerDepth / 2],
        [-containerWidth / 2, -containerHeight / 2, containerDepth / 2],
        [containerWidth / 2, -containerHeight / 2, containerDepth / 2],
        [-containerWidth / 2, containerHeight / 2, -containerDepth / 2],
        [containerWidth / 2, containerHeight / 2, -containerDepth / 2],
        [-containerWidth / 2, -containerHeight / 2, -containerDepth / 2],
        [containerWidth / 2, -containerHeight / 2, -containerDepth / 2]
      ].forEach(([cx, cy, cz]) => {
        const cMesh = new THREE.Mesh(cornerGeo, cornerMat);
        cMesh.position.set(cx, cy, cz);
        group.add(cMesh);
      });

      // Interior Screen Plane
      const screenGeo = new THREE.PlaneGeometry(containerWidth - 0.2, containerHeight - 0.2);
      const screenTex = createInteriorScreenTexture(cfg);
      const screenMat = new THREE.MeshBasicMaterial({ map: screenTex });
      const screenMesh = new THREE.Mesh(screenGeo, screenMat);
      screenMesh.position.set(0, 0, -containerDepth / 2 + wallThick + 0.02);
      group.add(screenMesh);
      group.userData.screenMesh = screenMesh;

      // Double Hinged Bi-Fold Doors
      const doorHalfW = (containerWidth - 0.06) / 2;
      const doorH = containerHeight - 0.06;
      const doorThickness = 0.04;

      const doorLeftTex = createDoorTextTexture(cfg.codeL, true, cfg.hex, cfg.textHex);
      const doorLeftMat = new THREE.MeshStandardMaterial({ map: doorLeftTex, bumpMap: corrugatedBumpTex, bumpScale: 0.03, roughness: 0.4 });
      const leftPivot = new THREE.Group();
      leftPivot.position.set(-containerWidth / 2 + 0.02, 0, containerDepth / 2);
      const doorLeftMesh = new THREE.Mesh(new THREE.BoxGeometry(doorHalfW, doorH, doorThickness), doorLeftMat);
      doorLeftMesh.position.set(doorHalfW / 2, 0, 0);
      doorLeftMesh.castShadow = true;
      leftPivot.add(doorLeftMesh);
      group.add(leftPivot);
      group.userData.leftDoor = leftPivot;

      const doorRightTex = createDoorTextTexture(cfg.codeR, false, cfg.hex, cfg.textHex);
      const doorRightMat = new THREE.MeshStandardMaterial({ map: doorRightTex, bumpMap: corrugatedBumpTex, bumpScale: 0.03, roughness: 0.4 });
      const rightPivot = new THREE.Group();
      rightPivot.position.set(containerWidth / 2 - 0.02, 0, containerDepth / 2);
      const doorRightMesh = new THREE.Mesh(new THREE.BoxGeometry(doorHalfW, doorH, doorThickness), doorRightMat);
      doorRightMesh.position.set(-doorHalfW / 2, 0, 0);
      doorRightMesh.castShadow = true;
      rightPivot.add(doorRightMesh);
      group.add(rightPivot);
      group.userData.rightDoor = rightPivot;

      return group;
    }

    function initializeContainers() {
      DOCK_CONTAINERS.forEach(c => scene.remove(c));
      DOCK_CONTAINERS.length = 0;

      containerConfigs.forEach((cfg, idx) => {
        const container = build3DContainer(cfg, idx);
        const coord = dockCoordinates[idx];
        container.position.set(coord.x, coord.y, coord.z);
        container.rotation.y = coord.rotY;

        container.userData.restPos = new THREE.Vector3(coord.x, coord.y, coord.z);
        container.userData.restRotY = coord.rotY;

        scene.add(container);
        DOCK_CONTAINERS.push(container);
      });

      renderNavigationControls();
    }

    // ==========================================
    // CRANE KINEMATICS & 3D UNBOXING SEQUENCER
    // ==========================================
    let hoistedContainer = null;
    let isKinematicRunning = false;
    let currentContainerIdx = 0;

    function hoist3DContainer(targetIdx, isInitial = false) {
      if (isKinematicRunning && !isInitial) return;
      isKinematicRunning = true;

      const targetContainer = DOCK_CONTAINERS[targetIdx];
      const cfg = targetContainer.userData.config;
      currentContainerIdx = targetIdx;

      updateButtonStates(targetIdx);

      const prev = hoistedContainer;
      const seq = gsap.timeline({
        onComplete: () => {
          isKinematicRunning = false;
        }
      });

      // Step 1: If holding a container, close doors, lower back to dock
      if (prev && prev !== targetContainer) {
        seq.to(prev.userData.leftDoor.rotation, { y: 0, duration: 0.45, ease: 'power2.inOut' });
        seq.to(prev.userData.rightDoor.rotation, { y: 0, duration: 0.45, ease: 'power2.inOut' }, '<');
        seq.to(interiorPointLight, { intensity: 0, duration: 0.3 }, '<');

        seq.to(prev.position, {
          x: prev.userData.restPos.x,
          y: prev.userData.restPos.y,
          z: prev.userData.restPos.z,
          duration: 0.8,
          ease: 'power3.inOut'
        });
        seq.to(prev.rotation, {
          y: prev.userData.restRotY,
          duration: 0.8,
          ease: 'power3.inOut'
        }, '<');

        seq.to(craneTrolleyGroup.position, { x: prev.userData.restPos.x, duration: 0.8, ease: 'power3.inOut' }, '<');
        seq.to(spreaderGroup.position, { y: prev.userData.restPos.y + 0.95 - 6.4, duration: 0.8, ease: 'power3.inOut' }, '<');

        seq.add(() => playMechanicalSound(340));
        seq.to(spreaderGroup.position, { y: -2.1, duration: 0.35, ease: 'power2.out' });
      }

      // Step 2: Slide Crane Carriage over to target container
      seq.to(craneTrolleyGroup.position, {
        x: targetContainer.userData.restPos.x,
        duration: 0.85,
        ease: 'power3.inOut'
      });

      // Step 3: Lower Spreader & Clamp
      seq.to(spreaderGroup.position, {
        y: targetContainer.userData.restPos.y + 0.95 - 6.4,
        duration: 0.65,
        ease: 'power2.inOut'
      });
      seq.add(() => playMechanicalSound(540));

      // Step 4: Hoist Container into Center Stage!
      const centerStageY = 0.4;
      const centerStageZ = 2.4;

      seq.to(targetContainer.position, {
        x: 0,
        y: centerStageY,
        z: centerStageZ,
        duration: 1.15,
        ease: 'power3.out',
        onStart: () => {
          hoistedContainer = targetContainer;
        }
      });
      seq.to(targetContainer.rotation, {
        y: 0,
        duration: 1.15,
        ease: 'power3.out'
      }, '<');

      seq.to(craneTrolleyGroup.position, { x: 0, duration: 1.15, ease: 'power3.out' }, '<');
      seq.to(spreaderGroup.position, { y: centerStageY + 0.95 - 6.4, duration: 1.15, ease: 'power3.out' }, '<');

      // Step 5: Swing Open Container Doors (The Physical Unboxing Moment!)
      seq.add(() => playMechanicalSound(720, 0.12, 'triangle'));
      seq.to(targetContainer.userData.leftDoor.rotation, {
        y: -Math.PI * 0.72,
        duration: 0.9,
        ease: 'back.out(1.4)'
      });
      seq.to(targetContainer.userData.rightDoor.rotation, {
        y: Math.PI * 0.72,
        duration: 0.9,
        ease: 'back.out(1.4)'
      }, '<');

      // Step 6: Focus Interior Warm Spotlight
      seq.to(interiorPointLight.position, { x: 0, y: 0.8, z: 2.2, duration: 0.01 }, '<');
      seq.to(interiorPointLight, { intensity: 1.8, duration: 0.6 }, '<');
    }

    // ==========================================
    // UI NAVIGATION CONTROLS GENERATOR
    // ==========================================
    function renderNavigationControls() {
      const navContainer = document.getElementById('topNavTabs');
      const dockContainer = document.getElementById('dockButtons');
      navContainer.innerHTML = '';
      dockContainer.innerHTML = '';

      containerConfigs.forEach((cfg, idx) => {
        // Top Nav Tab Button
        const tabBtn = document.createElement('button');
        tabBtn.id = `top-tab-${idx}`;
        tabBtn.className = 'px-4 py-1.5 rounded-full transition-all cursor-pointer text-xs font-mono font-bold';
        tabBtn.textContent = cfg.label;
        tabBtn.onclick = () => hoist3DContainer(idx);
        navContainer.appendChild(tabBtn);

        // Bottom Dock Pill Button
        const dockBtn = document.createElement('button');
        dockBtn.id = `dock-pill-${idx}`;
        dockBtn.className = 'px-4 py-2 rounded-full hud-glass text-xs font-mono font-bold text-navy transition-all cursor-pointer flex items-center gap-2 hover:bg-white shadow-md';
        dockBtn.innerHTML = `<span class="w-2.5 h-2.5 rounded-full" style="background-color: ${cfg.hex}; border: 1px solid rgba(0,0,0,0.2);"></span><span>${cfg.label}</span>`;
        dockBtn.onclick = () => hoist3DContainer(idx);
        dockContainer.appendChild(dockBtn);
      });

      updateButtonStates(0);
    }

    function updateButtonStates(activeIdx) {
      containerConfigs.forEach((cfg, idx) => {
        const topBtn = document.getElementById(`top-tab-${idx}`);
        const dockBtn = document.getElementById(`dock-pill-${idx}`);
        
        if (idx === activeIdx) {
          if (topBtn) topBtn.className = 'px-4 py-1.5 rounded-full bg-navy text-white font-bold text-xs font-mono shadow-md';
          if (dockBtn) dockBtn.className = 'px-4 py-2 rounded-full bg-navy text-white font-bold text-xs font-mono shadow-lg flex items-center gap-2 border-2 border-lemon';
        } else {
          if (topBtn) topBtn.className = 'px-4 py-1.5 rounded-full text-navy hover:bg-white/80 transition font-bold text-xs font-mono';
          if (dockBtn) dockBtn.className = 'px-4 py-2 rounded-full hud-glass text-xs font-mono font-bold text-navy transition-all cursor-pointer flex items-center gap-2 hover:bg-white shadow-md';
        }
      });
    }

    // ==========================================
    // INTERACTIVE RAYCASTING (CLICK CONTAINER TO UNBOX / LAUNCH)
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      // Ignore clicks on header and footer UI
      if (e.clientY < 90 || e.clientY > window.innerHeight - 90) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        let hitObject = intersects[0].object;
        let rootContainer = null;

        while (hitObject && hitObject.parent) {
          if (hitObject.userData && hitObject.userData.config) {
            rootContainer = hitObject;
            break;
          }
          hitObject = hitObject.parent;
        }

        if (rootContainer) {
          const idx = rootContainer.userData.index;
          if (hoistedContainer === rootContainer) {
            // Already unboxed: clicking inside executes the link!
            const cfg = rootContainer.userData.config;
            if (cfg.link) {
              window.open(cfg.link, '_blank');
            }
          } else {
            hoist3DContainer(idx);
          }
        }
      }
    });

    // Keyboard Navigation (Left / Right Arrows & Enter)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        const nextIdx = (currentContainerIdx + 1) % containerConfigs.length;
        hoist3DContainer(nextIdx);
      } else if (e.key === 'ArrowLeft') {
        const prevIdx = (currentContainerIdx - 1 + containerConfigs.length) % containerConfigs.length;
        hoist3DContainer(prevIdx);
      } else if (e.key === 'Enter') {
        if (hoistedContainer && hoistedContainer.userData.config.link) {
          window.open(hoistedContainer.userData.config.link, '_blank');
        }
      }
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // ANIMATION RENDER LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Cable physics tracking
      updateCables();

      // Gentle floating suspension wave when container is hoisted
      if (hoistedContainer && !isKinematicRunning) {
        hoistedContainer.position.y = 0.4 + Math.sin(elapsed * 1.8) * 0.03;
        spreaderGroup.position.y = hoistedContainer.position.y + 0.95 - 6.4;
      }

      renderer.render(scene, camera);
    }

    // Initialize Scene & Trigger Initial Unboxing of Container 0
    initializeContainers();
    updateCables();
    animate();

    // Auto-hoist first container cleanly after 0.5s
    setTimeout(() => {
      hoist3DContainer(0, true);
    }, 500);
  </script>

</body>
